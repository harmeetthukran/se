[project]
name = "nse-bot"
version = "0.1.0"
description = "NSE trading bot: Upstox data pipeline, backtester, scanner, news sentiment."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "vaderSentiment>=3.3",
    "matplotlib>=3.9",
    "tabulate>=0.9",
    "click>=8.1",
    "tenacity>=8.3",
    "tqdm>=4.66",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nse_bot*"]
